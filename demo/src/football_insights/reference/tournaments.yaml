# Tournament classification (hand-reviewed reference data; names and definitions only).
#
# Every tournament name in results.csv must appear exactly once below; ingest fails
# on an unclassified name so a new dataset version cannot slip one in silently.
#
# category drives the rating model's match-importance weight (k) and question filters:
#   friendly_like  -> question 7 counts it as a friendly
#   competitive    -> question 7 counts it as a competitive result
# The weights follow the widely used World Football Elo scheme (60/50/40/30/20);
# see docs/METHODS.md.
schema_version: 1
reviewed: 2026-09-29

categories:
  world_cup:                {k: 60, competitive: true,  friendly_like: false, label: "FIFA World Cup finals"}
  continental_championship: {k: 50, competitive: true,  friendly_like: false, label: "Continental championship finals"}
  intercontinental:         {k: 50, competitive: true,  friendly_like: false, label: "Intercontinental finals"}
  qualification:            {k: 40, competitive: true,  friendly_like: false, label: "Qualifiers"}
  nations_league:           {k: 40, competitive: true,  friendly_like: false, label: "Nations leagues"}
  regional_championship:    {k: 30, competitive: true,  friendly_like: false, label: "Regional championships"}
  multi_sport_games:        {k: 30, competitive: true,  friendly_like: false, label: "Multi-sport games"}
  non_fifa:                 {k: 30, competitive: true,  friendly_like: false, label: "Tournaments for teams outside FIFA"}
  friendly_tournament:      {k: 20, competitive: false, friendly_like: true,  label: "Invitational friendly tournaments and bilateral trophies"}
  friendly:                 {k: 20, competitive: false, friendly_like: true,  label: "Friendlies"}

# Question 6: senior world and continental championships, with the predecessor of the Gold Cup.
# The Confederations Cup is excluded: an invitational warm-up with a small field.
major_tournaments:
  - "FIFA World Cup"
  - "UEFA Euro"
  - "Copa América"
  - "African Cup of Nations"
  - "AFC Asian Cup"
