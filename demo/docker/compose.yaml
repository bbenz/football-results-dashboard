# Local run of the three images. From the repository root:
#   docker compose -f demo/docker/compose.yaml up --build
# or use `demo up` (demo/scripts/demo.ps1 or demo.sh), which also records the image digests
# for the badge and passes the data folder as FOOTBALL_DATA_DIR_HOST (an absolute path).
#
# The raw data folder is mounted read-only; ingest writes the curated store to a
# named volume; only web publishes a port, and only on this machine's loopback.
name: football-insights

services:
  ingest:
    build: { context: .., dockerfile: docker/Dockerfile, target: ingest }
    image: ${INGEST_IMAGE:-football-insights-ingest:local}
    environment:
      FOOTBALL_DATA_DIR: /data
      CURATED_DIR: /curated
      PLATFORM_NAME: Local
      OTEL_SERVICE_NAME: ingest
    volumes:
      - ${FOOTBALL_DATA_DIR_HOST:-../../data}:/data:ro
      - curated:/curated
    restart: "no"

  insights:
    build: { context: .., dockerfile: docker/Dockerfile, target: insights }
    image: ${INSIGHTS_IMAGE:-football-insights-insights:local}
    depends_on:
      ingest: { condition: service_completed_successfully }
    environment:
      CURATED_DIR: /curated
      PLATFORM_NAME: Local
      IMAGE_DIGEST: ${INSIGHTS_IMAGE_DIGEST:-}
      OTEL_SERVICE_NAME: insights
      LOCAL_TRACE_DIR: /traces
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT:-}
      AI_MODEL_DEPLOYMENT: ${AI_MODEL_DEPLOYMENT:-gpt-6-astra}
      AI_ALLOWED_DEPLOYMENTS: ${AI_ALLOWED_DEPLOYMENTS:-gpt-6-astra,gpt-6-sol}
      # Off unless compose.live.yaml (demo up -LiveModel) supplies a credential: a container can't use the host's
      # sign-in, so an endpoint in .env alone would make the badge claim a live model that can't be reached.
      AI_NARRATIVE_MODE: ${AI_NARRATIVE_MODE:-off}
    volumes:
      - curated:/curated:ro
      - ../../.local/traces:/traces
    expose: ["8081"]
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: docker/Dockerfile, target: web }
    image: ${WEB_IMAGE:-football-insights-web:local}
    depends_on:
      insights: { condition: service_healthy }
    environment:
      INSIGHTS_URL: http://insights:8081
      PLATFORM_NAME: Local
      IMAGE_DIGEST: ${WEB_IMAGE_DIGEST:-}
      OTEL_SERVICE_NAME: web
      LOCAL_TRACE_DIR: /traces
    volumes:
      - ../../.local/traces:/traces
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped

volumes:
  curated: {}
